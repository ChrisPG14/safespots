# Base de datos local para desarrollo.
# En producción usamos Postgres administrado (Neon/Supabase) con PostGIS habilitado.
#
# Arrancar:  docker compose up -d
# Conectar:  psql "postgresql://geo:geo@localhost:5433/georisk"
#
# Nota: el puerto host es 5433 para no chocar con un Postgres del sistema en 5432.

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: georisk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: georisk
      # NO definir LANG con una locale de español aquí.
      #
      # La imagen postgis/postgis se basa en Debian y solo trae generadas las
      # locales C.UTF-8 y en_US.utf8. Poner LANG=es_MX.utf8 hace que initdb
      # aborte con "invalid locale settings" y el contenedor muera al arrancar,
      # dejando el volumen a medio inicializar. El síntoma es confuso porque
      # `docker compose up` reporta el contenedor como "Started".
      #
      # El ordenamiento alfabético de los nombres de colonia se resuelve en la
      # interfaz con Intl.Collator de JavaScript, que sí conoce el español, así
      # que la base no necesita una locale especial.
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d georisk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
